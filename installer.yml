# Read by lib-installer. See https://github.com/nimaltd/lib-installer
#
# A library made to try the installer on, and a starting point for your own:
# copy this file to the root of your library's repository, and change what is
# yours. Only name and its headers or sources are required. The keys this
# library has no use for are here too, commented out, so every one is in one
# place.
#
# There is no version here. The installer reads it from the @version tag in
# the first header listed, so the source files are the only place it is written.
#
# Written for 4.0.0: every file keeps the path it has here, src/example.h
# lands at the library's src/example.h, and every path naming a place in the
# sketch starts at the sketch's folder. A key given twice in one place is
# refused, where YAML would keep the last without a word, and so is a key the
# arduino section does not have.

name: example                      # the library's name, and its folder
description: A period that never blocks, made to try lib-installer on
repository: https://github.com/nimaltd/lib-installer-example-arduino
license: Apache-2.0                # the licence's SPDX name
platform: arduino                  # the projects it is for: stm32, zephyr, esp32,
                                   # arduino and pio, one or a list of them

kind: utility                      # driver, middleware, rtos, protocol, filesystem,
                                   # utility or bsp
category: timing                   # sensor, storage, display, communication, wireless,
                                   # rtos, timing, power, input, math or system
provides: []                       # what it gives other libraries: [rtos] for an RTOS

requires:
  lib_installer: 4.0.0             # the oldest lib-installer that reads this file
  libraries: []                    # other libraries, installed first when missing,
                                   # always into the libraries folder:
                                   #   - osal >= 1.0.0       no owner means nimaltd
                                   #   - owner/lib           anyone else's
                                   #   - owner/lib@v1.2.0    a tag, branch or commit
                                   #   - source: owner/other@v2.0.0
                                   #     manifest: manifests/other.yml
                                   #                         for a repository with no
                                   #                         installer.yml of its own
  peripherals: []                  # hardware it uses, named to the user, such as:
                                   #   - type: i2c
                                   #     note: 400 kHz

headers:                           # .h files; the first is the one to #include
  - src/example.h                  # every file keeps its path: the library's src/example.h
  - src/example_config.h           # your settings, in USER CODE lines kept on update
sources:                           # .c and .cpp files, which Arduino builds
  - src/example.cpp
                                   # a wildcard works too: src/*.cpp in one folder,
                                   # src/**/*.cpp in every folder below src

options:                           # parts the user chooses at install
  uptime:                          # the name typed after --with and --without
    description: Uptime in hours, minutes and seconds   # the question asked
    libraries: []                  # libraries this part needs, installed first
    headers:                       # its files, written like headers and sources above
      - src/example_uptime.h
    sources:
      - src/example_uptime.cpp

extras:                            # copied as they are, never compiled
  - LICENSE.md                     # in the library's folder
  - NOTICE
  - README.md
  - tools                          # the library's tools/, which the step below runs from.
                                   # A root: puts one in the sketch instead, but only an
                                   # install into a sketch can have that

# once:                            # the sketch's own files, made when missing and the
#   - arduino_secrets.h            # user's from then on: never replaced or removed. Into
#   - from: templates/secrets.h    # a sketch only. A path alone lands at that path in
#     to: my_secrets.h             # the sketch, a to at another place

run:                               # steps run once the files are in, each asked first.
                                   # Into a sketch only: in the libraries folder they
                                   # are left unrun, and the install goes ahead
  - label: make-id                 # the name typed after --run and --no-run
    description: Make this board's own ID, example_id.h   # shown with the question
    script: "{library}/tools/make_id.py"   # Python, run with the installer's own Python.
                                   # {library} is the library's folder, wherever it went,
                                   # in quotes, since YAML reads a bare { as a mapping
    args: [example_id.h]           # given to the script, in the sketch's folder, where
                                   # the sketch includes it
    unless: example_id.h           # skipped when this file is there already

arduino:                           # read by lib-installer only, for library.properties
  architectures: ["*"]             # the boards it runs on, such as [avr, esp32]; * for any
  category: Timing                 # Arduino's own category; guessed from category above
                                   # when left out
  author: Nima Askari (NimaLTD)    # who wrote it; the repository's owner when left out
  # maintainer: you@example.com    # who looks after it; the author when left out
  # depends:                       # libraries from Library Manager it needs, by name
  #   - Adafruit BusIO             # with a version when one is needed:
  #   - ArduinoJson (>=6.0.0)      #   name (>=version)
